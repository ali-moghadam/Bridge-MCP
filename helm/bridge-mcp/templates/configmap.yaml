apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bridge-mcp.fullname" . }}-config
  labels:
    {{- include "bridge-mcp.labels" . | nindent 4 }}
data:
  # Non-secret service configuration. Tokens live in the Secret.
  JIRA_URL: {{ .Values.jira.url | quote }}
  JIRA_VERIFY_SSL: {{ .Values.jira.verifySSL | quote }}
  GITLAB_URL: {{ .Values.gitlab.url | quote }}
  GITLAB_VERIFY_SSL: {{ .Values.gitlab.verifySSL | quote }}
  CONFLUENCE_URL: {{ .Values.confluence.url | quote }}
  CONFLUENCE_USERNAME: {{ .Values.confluence.username | quote }}
  CONFLUENCE_VERIFY_SSL: {{ .Values.confluence.verifySSL | quote }}

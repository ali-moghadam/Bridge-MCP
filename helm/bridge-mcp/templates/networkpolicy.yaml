{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bridge-mcp.fullname" . }}
  labels:
    {{- include "bridge-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bridge-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress to the HTTP port from anywhere (router + kubelet probes).
    # OVN-Kubernetes enforces NetworkPolicy against node probe traffic, so an
    # empty `from` (all sources) is required for /healthz and /readyz to pass.
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}

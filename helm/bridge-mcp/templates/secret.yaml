{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bridge-mcp.fullname" . }}-secrets
  labels:
    {{- include "bridge-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared Bearer token that gates the /mcp endpoint.
  BRIDGE_MCP_AUTH_TOKEN: {{ .Values.auth.token | quote }}
  # Per-service Personal Access Tokens (empty = that service stays disabled).
  JIRA_PERSONAL_ACCESS_TOKEN: {{ .Values.jira.token | quote }}
  GITLAB_PERSONAL_ACCESS_TOKEN: {{ .Values.gitlab.token | quote }}
  CONFLUENCE_API_TOKEN: {{ .Values.confluence.token | quote }}
{{- end }}
